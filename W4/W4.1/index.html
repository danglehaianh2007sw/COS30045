<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 30px;
            background-color: #f4f4f9;
        }
        svg {
            border: 1px solid #333;
            background-color: #ffffff;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Exercise 4.1: Draw SVGs</h1>
    <svg width="500" height="500" viewBox="0 0 500 500">
        
        Sky Background (Rectangle):
        <rect x="0" y="0" width="500" height="350" fill="#87CEEB" />

        Sun (Circle):
        <circle cx="400" cy="100" r="40" fill="#FFD700" />

        Grass Ground (Rectangle):
        <rect x="0" y="350" width="500" height="150" fill="#228B22" />

        Garden Path (Path element):
        <path d="M 230 350 Q 250 420 300 500 M 270 350 Q 290 420 340 500" stroke="#FFD700" stroke-width="12" fill="none" />

        Tree Trunk (Rectangle):
        <rect x="80" y="270" width="25" height="100" fill="#8B4513" />

        Tree Foliage (Circle):
        <circle cx="92" cy="240" r="45" fill="#2E8B57" />

        House Base / Walls (Rectangle):
        <rect x="150" y="200" width="200" height="180" fill="#A0522D" />

        Roof (Polygon):
        <polygon points="130,200 250,90 370,200" fill="#CD853F" />

        Chimney (Rectangle):
        <rect x="290" y="115" width="25" height="50" fill="#8B4513" />

        Front Door & Doorknob:
        <rect x="225" y="280" width="50" height="100" fill="#654321" />
        <circle cx="265" cy="330" r="5" fill="black" />

        Group Element (<g>) with transform/translate for Windows:
        <g transform="translate(0, 0)">
            Left Window:
            <rect x="175" y="230" width="45" height="45" fill="#E0FFFF" stroke="#333" stroke-width="2" />
            Right Window:
            <rect x="280" y="230" width="45" height="45" fill="#E0FFFF" stroke="#333" stroke-width="2" />
        </g>
    </svg>

</body>
</html>
